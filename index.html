<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sprint Craft</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0b0f14;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        user-select: none;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
        outline: none;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        opacity: 0.85;
      }
      #crosshair:before,
      #crosshair:after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.85);
      }
      #crosshair:before {
        left: 50%;
        top: 0;
        width: 2px;
        height: 18px;
        transform: translateX(-50%);
      }
      #crosshair:after {
        left: 0;
        top: 50%;
        width: 18px;
        height: 2px;
        transform: translateY(-50%);
      }
      #hotbar {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        background: rgba(0, 0, 0, 0.25);
        padding: 8px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .slot {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        line-height: 1;
        position: relative;
      }
      .slot.selected {
        outline: 2px solid rgba(255, 255, 255, 0.95);
        background: rgba(255, 255, 255, 0.14);
      }
      .slot .swatch {
        position: absolute;
        inset: 6px;
        border-radius: 6px;
        opacity: 0.9;
      }
      #help {
        position: absolute;
        left: 12px;
        top: 12px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 10px 12px;
        color: rgba(255, 255, 255, 0.92);
        font-size: 12px;
        line-height: 1.35;
        max-width: 360px;
      }
      #help b {
        color: white;
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 6px 12px;
        opacity: 0;
        transition: opacity 160ms ease;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="renderCanvas" tabindex="0"></canvas>
      <div id="hud">
        <div id="crosshair"></div>
        <div id="toast"></div>
        <div id="help">
          <div><b>Sprint Craft</b> — click canvas for pointer lock</div>
          <div><b>WASD</b> move · <b>Mouse</b> look · <b>Space</b> jump</div>
          <div><b>Shift</b> sprint · <b>Ctrl</b> crouch/crawl</div>
          <div><b>LMB</b> break · <b>RMB</b> place · <b>1–9</b> select block</div>
        </div>
        <div id="hotbar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
